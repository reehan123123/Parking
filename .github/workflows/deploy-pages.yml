name: Build and deploy Parking PWA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: parking-pages-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://parking-85u.pages.dev
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      PARKING_PUSH_VAPID_PUBLIC_KEY: ${{ vars.PARKING_PUSH_VAPID_PUBLIC_KEY }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
          pub-cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Check push notification scripts
        run: |
          node --check web/push/push_client.js
          node --check web/push/parking_push_service_worker.js

      - name: Check parking notification Edge Function
        run: |
          npx --yes deno@2.9.6 check \
            --config supabase/functions/dispatch-parking-notifications/deno.json \
            supabase/functions/dispatch-parking-notifications/index.ts \
            supabase/functions/dispatch-parking-notifications/payload.ts \
            supabase/functions/dispatch-parking-notifications/payload_test.ts
          npx --yes deno@2.9.6 test \
            --config supabase/functions/dispatch-parking-notifications/deno.json \
            supabase/functions/dispatch-parking-notifications/payload_test.ts

      - name: Validate public Supabase configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_URL}" ]]; then
            echo "SUPABASE_URL is not configured in GitHub Actions secrets."
            exit 1
          fi

          if [[ -z "${SUPABASE_PUBLISHABLE_KEY}" ]]; then
            echo "SUPABASE_PUBLISHABLE_KEY is not configured in GitHub Actions secrets."
            exit 1
          fi

          if [[ -n "${PARKING_PUSH_VAPID_PUBLIC_KEY}" ]]; then
            node <<'NODE'
            const value = process.env.PARKING_PUSH_VAPID_PUBLIC_KEY;
            let key;
            try {
              key = Buffer.from(value, 'base64url');
            } catch {
              console.error('The public Web Push VAPID key is not valid base64url.');
              process.exit(1);
            }
            if (key.length !== 65 || key[0] !== 4) {
              console.error('The public Web Push VAPID key must be a 65-byte P-256 key.');
              process.exit(1);
            }
            NODE
          fi

          case "${SUPABASE_URL}" in
            http://*|https://*) ;;
            *)
              echo "SUPABASE_URL must use http:// or https://."
              exit 1
              ;;
          esac

          case "${SUPABASE_PUBLISHABLE_KEY}" in
            sb_secret_*|sb_service_role_*|*service_role*)
              echo "A secret/service-role key cannot be used in the browser build."
              exit 1
              ;;
          esac

          node <<'NODE'
          const key = process.env.SUPABASE_PUBLISHABLE_KEY;
          const parts = key.split('.');

          if (parts.length === 3) {
            try {
              const payload = JSON.parse(
                Buffer.from(parts[1], 'base64url').toString('utf8'),
              );
              if (payload.role === 'service_role') {
                console.error(
                  'A legacy service-role JWT cannot be used in the browser build.',
                );
                process.exit(1);
              }
            } catch {
              // Non-JWT publishable keys are handled by the prefix checks above.
            }
          }
          NODE

      - name: Build release web app
        shell: bash
        run: |
          set -euo pipefail

          flutter build web --release \
            --dart-define="SUPABASE_URL=${SUPABASE_URL}" \
            --dart-define="SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}" \
            --dart-define="PARKING_PUSH_VAPID_PUBLIC_KEY=${PARKING_PUSH_VAPID_PUBLIC_KEY}"

      - name: Verify release output
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/main.dart.js
          test -s build/web/flutter.js
          test -s build/web/manifest.json
          test -s build/web/favicon.png
          test -s build/web/icons/Icon-192.png
          test -s build/web/icons/Icon-512.png
          test -s build/web/_headers
          test -s build/web/push/push_client.js
          test -s build/web/push/parking_push_service_worker.js

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const files = [];
          const collectFiles = (directory) => {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const entryPath = path.join(directory, entry.name);
              if (entry.isDirectory()) {
                collectFiles(entryPath);
              } else if (/\.(?:css|html|js|json|svg|txt)$/i.test(entry.name)) {
                files.push(entryPath);
              }
            }
          };

          collectFiles('build/web');

          const exposedKeyPatterns = [
            /sb_(?:secret|service_role)_[A-Za-z0-9_-]{16,}/,
            /postgres(?:ql)?:\/\/[^:\s]+:[^@\s]+@/i,
          ];
          const jwtPattern =
            /eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}/g;

          for (const file of files) {
            const content = fs.readFileSync(file, 'utf8');
            if (exposedKeyPatterns.some((pattern) => pattern.test(content))) {
              console.error('A privileged credential-shaped value was found in release output.');
              process.exit(1);
            }

            for (const match of content.matchAll(jwtPattern)) {
              try {
                const payload = JSON.parse(
                  Buffer.from(match[0].split('.')[1], 'base64url').toString('utf8'),
                );
                if (payload.role === 'service_role') {
                  console.error('A service-role JWT was found in release output.');
                  process.exit(1);
                }
              } catch {
                // Ignore non-JWT strings that happen to match the shape.
              }
            }
          }
          NODE

      - name: Validate Cloudflare configuration
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || {
            echo "CLOUDFLARE_ACCOUNT_ID is not configured in the production environment."
            exit 1
          }
          test -n "${CLOUDFLARE_API_TOKEN}" || {
            echo "CLOUDFLARE_API_TOKEN is not configured in the production environment."
            exit 1
          }

      - name: Deploy to Cloudflare Pages
        id: deploy-pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.0'
          command: pages deploy build/web --project-name=parking
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Record Cloudflare deployment
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy-pages.outputs.deployment-url }}
          DEPLOYMENT_ALIAS_URL: ${{ steps.deploy-pages.outputs.pages-deployment-alias-url }}
        run: |
          set -euo pipefail
          test -n "${DEPLOYMENT_URL}"

          {
            echo "### Cloudflare Pages deployment"
            echo "- Wrangler deployment URL: ${DEPLOYMENT_URL}"
            if [[ -n "${DEPLOYMENT_ALIAS_URL}" ]]; then
              echo "- Pages alias URL: ${DEPLOYMENT_ALIAS_URL}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
